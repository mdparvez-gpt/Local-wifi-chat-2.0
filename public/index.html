<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Chat & Call Hub</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #f0f2f5; margin: 0; padding: 20px 10px; display: flex; justify-content: center; }
        .container { background: #fff; width: 100%; max-width: 420px; border-radius: 16px; padding: 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
        h1 { margin-top: 0; font-size: 26px; color: #000; font-weight: 800; text-align: center; }
        input[type="text"] { width: 100%; padding: 14px; border: 1px solid #e0e0e0; border-radius: 10px; font-size: 16px; outline: none; margin-bottom: 12px; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 12px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; text-align: center; color: #fff; }
        .btn-blue { background: #0084ff; }
        .btn-gray { background: #65676b; }
        .btn-green { background: #28a745; }
        .btn-red { background: #dc3545; }
        hr { border: none; border-top: 1px solid #e5e5e5; margin: 16px 0; }
        .hidden { display: none; }
        #messages { height: 220px; overflow-y: auto; border: 1px solid #e0e0e0; border-radius: 10px; padding: 12px; margin-bottom: 12px; background: #fafafa; }
        .video-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        video { width: 100%; height: 140px; background: #000; border-radius: 10px; object-fit: cover; }
    </style>
</head>
<body>

    <div class="container" id="main-card">
        <h1>Local Chat & Call Hub</h1>
        <input type="text" id="username" placeholder="Enter Your Name">
        
        <div class="btn-group">
            <button class="btn btn-blue" onclick="createRoom()">Create Room</button>
            <button class="btn btn-gray" onclick="joinRoom()">Direct Join</button>
        </div>
    </div>

    <div class="container hidden" id="chat-card">
        <h1 id="room-header">Chat Room</h1>

        <!-- Video Calling Display Area -->
        <div class="video-grid">
            <video id="localVideo" autoplay playsinline muted></video>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>

        <div class="btn-group">
            <button class="btn btn-green" onclick="startCall(true)">📹 Video Call</button>
            <button class="btn btn-blue" onclick="startCall(false)">🎙️ Audio Call</button>
        </div>

        <div id="messages"></div>
        <input type="text" id="msg-input" placeholder="Type a message...">
        <button class="btn btn-blue" style="width: 100%;" onclick="sendMsg()">Send Message</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentRoomId = '';
        let localStream;
        let peerConnection;
        const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        function createRoom() {
            const name = document.getElementById('username').value.trim();
            if(!name) return alert('Please enter your name');
            const roomId = prompt('Enter new Room Code:');
            if(roomId) socket.emit('create-room', { roomId });
        }

        function joinRoom() {
            const name = document.getElementById('username').value.trim();
            if(!name) return alert('Please enter your name');
            const roomId = prompt('Enter Room Code:');
            if(roomId) socket.emit('join-room', { roomId });
        }

        socket.on('room-created', ({ roomId }) => enterRoom(roomId));
        socket.on('room-joined', ({ roomId }) => enterRoom(roomId));
        socket.on('error-msg', (msg) => alert(msg));

        function enterRoom(roomId) {
            currentRoomId = roomId;
            document.getElementById('main-card').classList.add('hidden');
            document.getElementById('chat-card').classList.remove('hidden');
            document.getElementById('room-header').innerText = 'Room: ' + roomId;
        }

        function sendMsg() {
            const input = document.getElementById('msg-input');
            const name = document.getElementById('username').value || 'User';
            if(input.value.trim()) {
                socket.emit('send-message', { roomId: currentRoomId, message: input.value, sender: name });
                input.value = '';
            }
        }

        socket.on('receive-message', ({ message, sender, time }) => {
            const box = document.getElementById('messages');
            box.innerHTML += `<div><strong>${sender}:</strong> ${message} <span style="font-size:11px;color:gray;">(${time})</span></div>`;
            box.scrollTop = box.scrollHeight;
        });

        // WebRTC Logic for Audio/Video Calls
        async function startCall(videoEnabled) {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: videoEnabled, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
                createPeerConnection();
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('offer', { roomId: currentRoomId, offer });
            } catch (err) {
                alert('Camera/Microphone Permission Required for Calling!');
            }
        }

        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(config);
            peerConnection.onicecandidate = (e) => {
                if (e.candidate) socket.emit('candidate', { roomId: currentRoomId, candidate: e.candidate });
            };
            peerConnection.ontrack = (e) => {
                document.getElementById('remoteVideo').srcObject = e.streams[0];
            };
        }

        socket.on('offer', async (data) => {
            if (!peerConnection) createPeerConnection();
            if (!localStream) {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            }
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('answer', { roomId: currentRoomId, answer });
        });

        socket.on('answer', async (data) => {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
        });

        socket.on('candidate', async (data) => {
            if (peerConnection) await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        });
    </script>
</body>
</html>
