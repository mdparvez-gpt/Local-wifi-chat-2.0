<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Chat Hub</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #f0f2f5; margin: 0; padding: 20px 10px; display: flex; justify-content: center; }
        .container { background: #fff; width: 100%; max-width: 420px; border-radius: 16px; padding: 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
        h1 { margin-top: 0; font-size: 28px; color: #000; font-weight: 800; }
        input[type="text"], input[type="password"] { width: 100%; padding: 14px; border: 1px solid #e0e0e0; border-radius: 10px; font-size: 16px; outline: none; margin-bottom: 12px; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 12px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; text-align: center; color: #fff; }
        .btn-blue { background: #0084ff; }
        .btn-gray { background: #65676b; }
        .btn-green { background: #28a745; width: 100%; margin-bottom: 16px; }
        hr { border: none; border-top: 1px solid #e5e5e5; margin: 16px 0; }
        h3 { font-size: 20px; margin: 0 0 12px 0; color: #000; }
        .status-text { color: #555; font-size: 15px; margin-bottom: 10px; }
        .hidden { display: none; }
        #chat-section { display: none; }
        #messages { height: 300px; overflow-y: auto; border: 1px solid #e0e0e0; border-radius: 10px; padding: 12px; margin-bottom: 12px; background: #fafafa; }
    </style>
</head>
<body>

    <div class="container" id="main-card">
        <h1>Local Chat Hub</h1>
        
        <input type="text" id="username" placeholder="Enter Your Name">
        
        <div class="btn-group">
            <button class="btn btn-blue" onclick="createRoom()">Create Room</button>
            <button class="btn btn-gray" onclick="joinRoom()">Direct Join</button>
        </div>

        <button class="btn btn-green" onclick="requestNotification()">🔔 Enable Notifications</button>

        <hr>

        <h3>Online Users</h3>
        <div class="status-text" id="online-users">No users online.</div>

        <hr>

        <h3>Active Rooms</h3>
        <div class="status-text" id="active-rooms">No active rooms found.</div>
    </div>

    <div class="container hidden" id="chat-card">
        <h1 id="room-header">Chat Room</h1>
        <div id="messages"></div>
        <input type="text" id="msg-input" placeholder="Type a message...">
        <button class="btn btn-blue" style="width: 100%;" onclick="sendMsg()">Send Message</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        function createRoom() {
            const name = document.getElementById('username').value.trim();
            if(!name) return alert('Please enter your name');
            const roomId = prompt('Enter new Room Name or Code:');
            if(roomId) {
                socket.emit('create-room', { roomId, password: '' });
            }
        }

        function joinRoom() {
            const name = document.getElementById('username').value.trim();
            if(!name) return alert('Please enter your name');
            const roomId = prompt('Enter Room Code to Join:');
            if(roomId) {
                socket.emit('join-room', { roomId, password: '' });
            }
        }

        function requestNotification() {
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        alert("Notifications Enabled!");
                    }
                });
            } else {
                alert("Notifications not supported in this browser.");
            }
        }

        socket.on('room-created', ({ roomId }) => enterRoom(roomId));
        socket.on('room-joined', ({ roomId }) => enterRoom(roomId));
        socket.on('error-msg', (msg) => alert(msg));

        function enterRoom(roomId) {
            document.getElementById('main-card').classList.add('hidden');
            document.getElementById('chat-card').classList.remove('hidden');
            document.getElementById('room-header').innerText = 'Room: ' + roomId;
        }

        function sendMsg() {
            const input = document.getElementById('msg-input');
            const name = document.getElementById('username').value || 'User';
            if(input.value.trim()) {
                socket.emit('send-message', { roomId: document.getElementById('room-header').innerText.replace('Room: ', ''), message: input.value, sender: name });
                input.value = '';
            }
        }

        socket.on('receive-message', ({ message, sender, time }) => {
            const box = document.getElementById('messages');
            box.innerHTML += `<div><strong>${sender}:</strong> ${message} <span style="font-size:11px;color:gray;">(${time})</span></div>`;
            box.scrollTop = box.scrollHeight;
        });
    </script>
</body>
</html>
